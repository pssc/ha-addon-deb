name: Add-on version

on:
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  check-version:
    name: Check add-on version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require a version bump for Dockerfile changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.sha }}
        run: |
          failed=false

          for config in */config.yaml; do
            app="${config%/config.yaml}"
            if ! git diff --quiet "$BASE_SHA" "$PR_SHA" -- "$app/Dockerfile"; then
              base_version=$(git show "$BASE_SHA:$config" | sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+)*)[[:space:]]*$/\1/p' | head -n 1)
              current_version=$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+)*)[[:space:]]*$/\1/p' "$config" | head -n 1)

              if [[ -z "$base_version" || -z "$current_version" ]]; then
                echo "Could not read numeric version from $config (base: '${base_version:-missing}', PR: '${current_version:-missing}')."
                failed=true
                continue
              fi

              if ! BASE_VERSION="$base_version" CURRENT_VERSION="$current_version" python3 - <<'PY'
          import os
          import sys

          def parts(value):
              return tuple(int(part) for part in value.split("."))

          base = parts(os.environ["BASE_VERSION"])
          current = parts(os.environ["CURRENT_VERSION"])
          width = max(len(base), len(current))
          base += (0,) * (width - len(base))
          current += (0,) * (width - len(current))
          sys.exit(0 if current > base else 1)
          PY
              then
                echo "$config must increase from $base_version (current: $current_version) when $app/Dockerfile changes."
                failed=true
              else
                echo "$config version increased: $base_version -> $current_version"
              fi
            fi
          done

          if [[ "$failed" == true ]]; then
            exit 1
          fi
